# Hub config: non-secret settings only. Copy to /var/lib/hub/hub.toml (or point HUB_CONFIG at it).
# Secrets live next to it in /var/lib/hub: `token` (this box's own token, 0640 so Kodi reads it; each paired TV
# gets its own, stored only as a hash) and `key` (encrypts the settings
# table in hub.sqlite: stream addon links, the AIOStreams account; 0600). Back them up with the
# database or the settings are unreadable.
#
# First run: the TV shows a QR for http://<box>:8097/setup?n=<one-time nonce> (it reads the link from
# GET /setup/link on the box itself). The phone page takes the debrid key, sets up streams, picks a speed.
# The setup page answers only while no stream source is configured, or for 10 minutes after a paired
# device calls POST /setup/open.
#
# Pairing a TV: every call except GET /health (just {ok} without a token), pairing and the setup page needs "Authorization: Bearer <token>".
#   Easy way: the TV calls POST /pair/request {name}, shows the 6-digit code, and polls GET /pair/request/<id>;
#   approve it on the setup page by typing that code (POST /pair/approve {requestId, code}). Requests expire after 10 minutes.
#   Headless way: type the six words from GET /pair (read on the box itself) into POST /pair {words}.

# 0.0.0.0 because Player on the Android box reaches the hub over the LAN. On a box where only
# local Kodi talks to it, "127.0.0.1" keeps it off the network.
bind = "0.0.0.0"
port = 8097
# The hub refuses to start if bind would listen on a public IP. Only for a deliberate exposure:
# allow_public = true

# Host names the hub answers to (DNS rebinding guard). 127.0.0.1, localhost, ::1 and the box's current LAN
# address always work; any other Host header gets 421. Add a name here if a front end reaches the box by one,
# e.g. its mDNS or router name:
# hosts = ["mediabox.local"]

# LAN discovery: a UDP `MEDIABOX?`, space-padded to 64 bytes, to this port (or broadcast) is answered with
# `MEDIABOX 1 <port> <name>`. Nothing about the user is in the reply.
name = "Media box"
discovery_port = 8098

# The AIOStreams instance "Set up for me" creates an account in, from that instance's own starter
# template. The box runs its own at 127.0.0.1:3000; on the EliteMini, point this at the existing one.
aiostreams_url = "http://127.0.0.1:3000"

# Presets are named by the connection: slow, standard, fast, max (GET /presets lists them with their numbers).
# Front ends pick one per call with ?preset=, and can cap it with ?max_mbps= ?max_res= ?cut= (a box on Wi-Fi
# measures its link and sends ?max_mbps=). Old names best/balanced/saver still work for now (= max/standard/slow).
preset = "standard"

# Each table below is the built-in default; set only the keys you want to change. Keys: prefer
# ("highest_bitrate" | "addon_order"), min_res, max_res ("480p" | "720p" | "1080p" | "2160p"), max_mbps, max_gb,
# require_cached, cut (theatrical, directors, extended, unrated, imax, remastered, criterion, final).
# Mbps = size / runtime. If nothing fits, the hub gives up require_cached, then min_res, then max_mbps,
# and says which in source.relaxed.
# [presets.slow]
# max_res = "1080p"
# max_mbps = 8
# prefer = "highest_bitrate"
# cut = "theatrical"
# [presets.standard]
# max_mbps = 20
# prefer = "highest_bitrate"
# cut = "theatrical"
# [presets.fast]
# max_mbps = 45
# prefer = "highest_bitrate"
# cut = "theatrical"
# [presets.max]
# prefer = "highest_bitrate"
# require_cached = true
# cut = "theatrical"

# Catalog and metadata addons (Stremio manifest URLs), asked in this order.
meta_addons = ["https://v3-cinemeta.strem.io/manifest.json"]

# Stream addons (e.g. your AIOStreams manifest URL) embed config tokens, so they are not kept here.
# The setup page stores them encrypted. A link listed here is imported once on start (then delete the
# line; the hub logs a reminder). None ship with the box.
# stream_addons = ["https://…/manifest.json"]

# What GET /new shows. One table or a list of them:
#   new_catalog = { addon = "https://…/manifest.json", type = "movie", id = "<catalog id>" }
#   new_catalog = [ { addon = "…", type = "movie", id = "…" }, { addon = "…", type = "series", id = "…" } ]
# Unset (the default): Cinemeta's movie and series "top" catalogs, kept to titles from this year
# and last year, newest first. A catalog you name here is used as is (no year filter), newest year first.
# new_catalog = { addon = "https://v3-cinemeta.strem.io/manifest.json", type = "movie", id = "top" }
