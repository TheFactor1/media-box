# Hub on the EliteMini, next to AIOStreams. From this directory:
#   mkdir -p ./data && cp hub.example.toml ./data/hub.toml   # then add your AIOStreams manifest URL
#   docker compose up -d --build
# Player on the Android box then uses http://<elitemini-lan-ip>:8097.
services:
  hub:
    build:
      context: .
      dockerfile: Containerfile
    container_name: hub
    restart: unless-stopped
    # Real Docker Engine only. On Docker Desktop (a VM) host networking never reaches the LAN;
    # run natively with hub.service instead.
    network_mode: host
    volumes:
      - ./data:/var/lib/hub
