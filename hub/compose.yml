# Hub on the EliteMini, next to AIOStreams. From this directory:
#   mkdir -p ./data && cp hub.example.toml ./data/hub.toml   # then add your AIOStreams manifest URL
#   docker compose up -d --build
# Player on the Android box then uses http://<elitemini-lan-ip>:8097.
services:
  hub:
    build:
      context: .
      dockerfile: Containerfile
    container_name: hub
    restart: unless-stopped
    # Host network: the UDP beacon, per-device rate limits and the setup QR all need the real LAN address.
    network_mode: host
    volumes:
      - ./data:/var/lib/hub
