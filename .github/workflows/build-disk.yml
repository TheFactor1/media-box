name: Build ISO

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["disk_config/**", ".github/workflows/build-disk.yml"]

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet

      - name: Lowercase image path
        run: echo "IMAGE=$(echo '${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Pull image
        run: |
          echo '${{ github.token }}' | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          sudo podman pull "$IMAGE:latest"

      - name: Build anaconda ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v ./disk_config/iso.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --config /config.toml "$IMAGE:latest"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: iso
          path: output/bootiso/*.iso
          retention-days: 7
