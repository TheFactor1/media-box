# RELEASE installer: no login user, root locked, sshd off (the image disables it). The dev variant with an
# SSH login is iso-dev.toml. Recovery on a release box means reinstalling until the wizard can enable SSH.
[customizations.installer.kickstart]
contents = """
text
network --bootproto=dhcp --activate
zerombr
clearpart --all --initlabel
autopart --type=btrfs --nohome
rootpw --lock
reboot
"""
