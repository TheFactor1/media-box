# Player user; created at boot by systemd-sysusers (groups like audio/video/
# render/input only exist at boot, so useradd at image build can't join them).
u media 1000 "Media player" /var/lib/media /usr/sbin/nologin
m media audio
m media video
m media render
m media input
# Separate service users: Kodi add-ons (running as media) must not read the hub's key or AIOStreams' data.
u hub 1001 "Media box hub" /var/lib/hub /usr/sbin/nologin
u aiostreams 1002 "AIOStreams" /var/lib/aiostreams /usr/sbin/nologin
