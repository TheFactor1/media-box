function duplicate() { const e = current(); if (!e) return; const c = { ...structuredClone(e), id: 'c' + Date.now(), label: e.label + ' copy', custom: true, x: e.x + 24, y: e.y + 24 }; snapshot(sel.owner); els(sel.owner).push(c); sel = { id: c.id, owner: sel.owner }; touch(sel.owner); draw(); }
function reorder(d) { const l = els(sel.owner); const e = current(); const i = l.indexOf(e); const j = i + d; if (j < 0 || j >= l.length) return; snapshot(sel.owner); [l[i], l[j]] = [l[j], l[i]]; touch(sel.owner); draw(); }

$('#anim').append(...Object.entries(ROW_ANIMS).map(([k, v]) => h('option', { value: k }, v.name)));
$('#anim').value = 'riffle';
$('#anim').addEventListener('change', (ev) => { prefs.rowAnim = ev.target.value; savePrefs(); });
$('#edit').addEventListener('click', () => { editing = !editing; sel = null; draw(); });
$('#undo').addEventListener('click', () => { const u = undoStack.pop(); if (!u) return; layouts[u[0]] = JSON.parse(u[1]); touch(u[0]); draw(); });
let resetArmed = false;
$('#reset').addEventListener('click', (ev) => {
  if (!resetArmed) { resetArmed = true; ev.target.textContent = 'Click again to reset'; setTimeout(() => { resetArmed = false; ev.target.textContent = 'Reset this page'; }, 3000); return; }
  resetArmed = false; ev.target.textContent = 'Reset this page'; snapshot(page); layouts[page] = structuredClone(DEFAULTS[page]); touch(page); sel = null; draw();
});
addEventListener('keydown', (ev) => {
  if (!editing || !sel || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  const step = ev.shiftKey ? 20 : 2;
  const d = { ArrowLeft: ['x', -step], ArrowRight: ['x', step], ArrowUp: ['y', -step], ArrowDown: ['y', step] }[ev.key];
  if (!d) return;
  ev.preventDefault();
  const e = current(); if (!e) return;
  snapshot(sel.owner); e[d[0]] += d[1];
  const n = $(`#stage [data-id="${CSS.escape(e.id)}"][data-owner="${sel.owner}"]`);
  if (n) { n.style.left = e.x + 'px'; n.style.top = e.y + 'px'; }
  syncNumbers(e); touch(sel.owner);
});
new ResizeObserver(fit).observe($('#view'));
draw();
loadSaved();
</script>
